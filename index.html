<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MealLink - Gestione Digitale Mense</title>
    <meta name="description" content="Sistema digitale professionale per la gestione delle mense aziendali" />
    <meta name="author" content="SOFTTHECHEFS" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#22c55e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MealLink" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="MealLink - Gestione Digitale Mense" />
    <meta property="og:description" content="Sistema digitale professionale per la gestione delle mense aziendali" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MealLink - Gestione Digitale Mense" />
    <meta name="twitter:image" content="/pwa-icon-512.png" />

    <!-- Identità PWA dipendente: applicata PRIMA del render, così iOS Safari
         legge manifest/icone corrette al primo caricamento -->
    <script>
      (function () {
        var p = location.pathname;
        if (p.indexOf("/dipendente") !== 0 && p.indexOf("/install-dipendente") !== 0) return;
        var m = document.querySelector('link[rel="manifest"]');
        if (m) m.setAttribute("href", "/manifest-dipendente.webmanifest");
        // L'hosting può aggiungere in seguito il manifest principale: su iOS
        // va rimosso, altrimenti prevalgono nome e avvio dell'app Chef.
        new MutationObserver(function () {
          var manifests = document.querySelectorAll('link[rel="manifest"]');
          manifests.forEach(function (el, index) {
            if (index === 0) el.setAttribute("href", "/manifest-dipendente.webmanifest");
            else el.parentNode.removeChild(el);
          });
        }).observe(document.head, { childList: true });
        document.querySelectorAll('link[rel="apple-touch-icon"], link[rel="icon"]').forEach(function (el) {
          el.parentNode.removeChild(el);
        });
        var ai = document.createElement("link");
        ai.rel = "apple-touch-icon";
        ai.setAttribute("sizes", "180x180");
        ai.href = "/apple-touch-icon-dipendente.png";
        document.head.appendChild(ai);
        var ic = document.createElement("link");
        ic.rel = "icon";
        ic.type = "image/png";
        ic.href = "/pwa-dipendente-192.png";
        document.head.appendChild(ic);
        function setMeta(n, c) {
          var el = document.querySelector('meta[name="' + n + '"]');
          if (!el) {
            el = document.createElement("meta");
            el.setAttribute("name", n);
            document.head.appendChild(el);
          }
          el.setAttribute("content", c);
        }
        setMeta("apple-mobile-web-app-title", "Dipendente");
        setMeta("application-name", "MealLink Dipendente");
        setMeta("theme-color", "#16a34a");
        document.title = "MealLink Dipendente";
      })();
    </script>
  </head>


  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
